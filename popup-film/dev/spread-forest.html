<!doctype html>
<!--
  dev/spread-forest.html (T-forest) — harness for src/spreads/forest.js, "The Whispering Forest".
  The spread alone in its spread frame (lifted to y = 0.14 on a stand-in book block) under the real
  environment (env.update(t) gives the right lamp for the film time): the right page is fixed on
  y = 0, the left page is posed at α; both carry the spread's leftArt/rightArt; the spread group
  is updated with (α, t, t − 7).
  Query: alpha=<0..1> (×π, default 1) · t=<film seconds> (default 19) · play=1 (advance t in real
  time) · free=1 (orbit controls) · view=front|wide|low|top|left|boat|birth
  (boat follows the boat / the folding page; birth is a close-up of the spring).
  On load it runs a layout self-test of every V-fold half and standUp over 360 opening angles
  (no crossings, nothing outside the book; failures go to console.error) and shows it with the
  mesh count in the HUD. Sets window.__ready once two frames have been rendered.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest spread harness</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #0b0908; --fg: #e8e4da; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
    #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.4 system-ui, sans-serif; opacity: 0.7; pointer-events: none; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
  <div id="hud"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as paper from '../src/paper.js';
    import * as popup from '../src/popup.js';
    import { createEnvironment } from '../src/environment.js';
    import { makeRng } from '../src/util/rng.js';
    import forest, { LAYOUT } from '../src/spreads/forest.js';

    const PI = Math.PI;
    const START = 7;
    const BOOK = { PAGE_W: 3, PAGE_D: 4, BOARD_T: 0.035, LEAVES: 5 };
    const LIFT = 0.14; // spread frame height above the desk (book stack)
    const params = new URLSearchParams(location.search);
    const num = (k, d) => (params.has(k) && Number.isFinite(Number(params.get(k))) ? Number(params.get(k)) : d);
    const alpha = PI * Math.min(1, Math.max(0, num('alpha', 1)));
    const t0 = num('t', 19);
    const view = params.get('view') ?? 'front';
    const play = params.get('play') === '1';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
    const env = createEnvironment({ scene, renderer });

    // ---- stand-in book: a block under the right page, the left page + its board on a hinge
    const frame = new THREE.Group();
    frame.position.y = LIFT;
    scene.add(frame);
    const cloth = new THREE.MeshStandardMaterial({ color: '#6e2a26', roughness: 0.8 });
    const edges = new THREE.MeshStandardMaterial({ color: '#efe6d2', roughness: 0.95 });
    const block = new THREE.Mesh(new THREE.BoxGeometry(3.06, LIFT, 4.12), [edges, cloth, edges, cloth, edges, edges]);
    block.position.set(1.53, -LIFT / 2 - 0.003, 0);
    block.castShadow = block.receiveShadow = true;
    frame.add(block);
    const api = forest.build({ THREE, paper, popup, rng: makeRng(1001), BOOK });
    const pageGeo = (x) => new THREE.PlaneGeometry(3, 4).rotateX(-PI / 2).translate(x, 0, 0);
    const right = new THREE.Mesh(pageGeo(1.5), paper.paperMaterial({ map: paper.texture(api.rightArt) }));
    right.receiveShadow = true;
    frame.add(right);
    const hinge = new THREE.Group();
    hinge.rotation.z = alpha - PI;
    frame.add(hinge);
    const left = new THREE.Mesh(pageGeo(-1.5), paper.paperMaterial({ map: paper.texture(api.leftArt) }));
    left.receiveShadow = true;
    const board = new THREE.Mesh(new THREE.BoxGeometry(3.06, 0.04, 4.12), [edges, cloth, edges, edges, edges, edges]);
    board.position.set(-1.53, -0.0235, 0);
    board.castShadow = board.receiveShadow = true;
    hinge.add(left, board);
    if (alpha > 0.98 * PI) {
      const leftBlock = block.clone();
      leftBlock.position.x = -1.53;
      frame.add(leftBlock);
    }
    frame.add(api.group);

    // ---- cameras
    const VIEWS = {
      front: [[0, 6.2, 7.6], [0, 0.6, -0.2]],
      wide: [[5.5, 7, 10.5], [0, 0.5, 0]],
      low: [[0.3, 1.5, 6.6], [0, 0.75, -0.3]],
      top: [[0, 11.5, 1.2], [0, 0, 0]],
      left: [[-6.2, 2.3, 3.4], [-1.4, 0.55, -0.5]],
      birth: [[-2.75, 1.0, 0.3], [-1.9, 0.22, -1.2]],
    };
    const target = new THREE.Vector3();
    const boatPos = new THREE.Vector3();
    let controls = null;
    function aim(t) {
      if (view === 'boat') {
        const b = api.group.getObjectByName('forest-boat');
        const s = api.group.getObjectByName('forest-sheet');
        (b.visible ? b : s).getWorldPosition(boatPos);
        camera.position.set(boatPos.x + 0.9, boatPos.y + 0.85, boatPos.z + 2.1);
        target.set(boatPos.x, boatPos.y + 0.12, boatPos.z);
      } else {
        const [p, q] = VIEWS[view] ?? VIEWS.front;
        camera.position.set(p[0], p[1] + LIFT, p[2]);
        target.set(q[0], q[1] + LIFT, q[2]);
      }
      camera.lookAt(target);
    }
    if (params.get('free') === '1') {
      aim(t0);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(target);
      controls.update();
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---- layout self-test: every card's bounding rectangle (V-fold halves, standUps) is posed at
    // 360 opening angles; no rectangle may cross another mechanism's or leave the wedge between
    // the pages, and closed (small α) everything must lie within the page. Failures → console.error.
    function layoutSelfTest() {
      const pieces = [];
      for (const [name, f] of Object.entries(LAYOUT.folds)) {
        const m = popup.vFold({ z0: f.z0, gamma: LAYOUT.gamma });
        pieces.push({ name: `${name}.R`, mech: m, mount: m.right, rect: [0, f.halfWidth, 0, f.height] });
        pieces.push({ name: `${name}.L`, mech: m, mount: m.left, rect: [-(f.leftReach ?? f.halfWidth), 0, 0, f.height] });
      }
      for (const [name, f] of Object.entries(LAYOUT.flats)) {
        const m = popup.standUp({ side: f.side, x: f.x, z: f.z, fold: f.fold });
        pieces.push({ name, mech: m, mount: m.mount, rect: [-f.width / 2, f.width / 2, 0, f.height] });
      }
      const root = new THREE.Group();
      for (const p of pieces) if (!p.mech.object.parent) root.add(p.mech.object);
      const corners = pieces.map(() => [0, 1, 2, 3].map(() => new THREE.Vector3()));
      const d = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
      const h = new THREE.Vector3(), sv = new THREE.Vector3(), q = new THREE.Vector3();
      const EPS = 1e-4;
      const segTri = (a, b, p0, p1, p2) => {
        d.subVectors(b, a);
        e1.subVectors(p1, p0);
        e2.subVectors(p2, p0);
        h.crossVectors(d, e2);
        const det = e1.dot(h);
        if (Math.abs(det) < 1e-12) return false;
        sv.subVectors(a, p0);
        const u = sv.dot(h) / det;
        if (u < EPS || u > 1 - EPS) return false;
        q.crossVectors(sv, e1);
        const w = d.dot(q) / det;
        if (w < EPS || u + w > 1 - EPS) return false;
        const t = e2.dot(q) / det;
        return t > EPS && t < 1 - EPS;
      };
      const crosses = (A, B) => A.some((a, i) => {
        const b = A[(i + 1) % 4];
        return segTri(a, b, B[0], B[1], B[2]) || segTri(a, b, B[0], B[2], B[3]);
      });
      const problems = new Set();
      for (let i = 0; i <= 360; i++) {
        const al = 0.03 + (PI - 0.03) * (i / 360);
        for (const p of pieces) p.mech.update(al);
        root.updateMatrixWorld(true);
        pieces.forEach((p, k) => {
          const [x0, x1, y0, y1] = p.rect;
          [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].forEach(([x, y], j) => corners[k][j].set(x, y, 0).applyMatrix4(p.mount.matrixWorld));
          for (const c of corners[k]) {
            const ang = Math.atan2(c.y, c.x);
            if (ang < -1e-3 || ang > al + 1e-3 || Math.abs(c.z) > 2.001 || (al < 0.1 && Math.hypot(c.x, c.y) > 3.001)) problems.add(`${p.name} leaves the book`);
          }
        });
        for (let a = 0; a < pieces.length; a++) {
          for (let b = a + 1; b < pieces.length; b++) {
            if (pieces[a].mech === pieces[b].mech) continue;
            if (crosses(corners[a], corners[b]) || crosses(corners[b], corners[a])) problems.add(`${pieces[a].name} × ${pieces[b].name}`);
          }
        }
      }
      for (const p of problems) console.error(`forest layout: ${p}`);
      return problems.size ? `layout: ${problems.size} problem(s)` : 'layout: clean';
    }
    const selfTest = layoutSelfTest();
    let meshes = 0;
    api.group.traverse((o) => { if (o.isMesh || o.isPoints) meshes++; });

    const hud = document.getElementById('hud');
    hud.hidden = params.get('ui') === '0';
    const clock0 = performance.now();
    let frames = 0;
    renderer.setAnimationLoop(() => {
      const t = play ? t0 + (performance.now() - clock0) / 1000 : t0;
      env.update(t);
      api.update(alpha, t, t - START);
      if (!controls) aim(t);
      renderer.render(scene, camera);
      hud.textContent = `t ${t.toFixed(2)}  α ${(alpha / PI).toFixed(2)}π  view ${view}  ·  ${meshes} meshes  ·  ${selfTest}`;
      if (++frames >= 2) window.__ready = true;
    });
  </script>
</body>
</html>
