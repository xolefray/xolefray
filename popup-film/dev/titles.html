<!doctype html>
<!--
  dev/titles.html (T-titles) — harness for src/titles.js.
  Paints a cheap stand-in for each film frame on a 2D canvas (desk, lamp pool, open book whose
  bright pages run under the captions) and drives createTitles() from film time.
  ?t=<sec> seek + pause · ?play=1 play · ?bg=paper worst case: bright cream paper everywhere ·
  ui≠0 shows a scrubber. Sets window.__ready after fonts load and two frames render.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titles harness</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b0a; }
    #bg, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; }
    #bg { z-index: 0; display: block; }
    #overlay { z-index: 1; pointer-events: none; }
    #scrub {
      position: fixed; z-index: 2; left: 16px; right: 16px; bottom: 12px;
      display: flex; gap: 12px; align-items: center; color: #f3ead8; font: 14px system-ui, sans-serif;
    }
    #scrub[hidden] { display: none; }
    #scrub input { flex: 1; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="overlay"></div>
  <div id="scrub" hidden><button id="pp">Play</button><input id="range" type="range" min="0" max="96" step="0.01"><span id="time"></span></div>
  <script type="module">
    import { createTitles } from '../src/titles.js';
    import { DURATION, Player, SPREADS, seg, smoothstep } from '../src/timeline.js';

    const params = new URLSearchParams(location.search);
    const paperOnly = params.get('bg') === 'paper';
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    const titles = createTitles(document.getElementById('overlay'));
    const player = new Player(DURATION);
    player.seek(parseFloat(params.get('t') ?? '0') || 0);
    if (params.get('play') === '1') player.play();

    const PAGES = {
      forest: ['#efe6cf', '#6f9a58', '#3f6b3a'],
      sea: ['#e9e4d2', '#4f8db0', '#2c5d84'],
      city: ['#2a3150', '#f2c46b', '#151a30'],
      sky: ['#f6dccc', '#f0a37f', '#f7e3a4'],
    };

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }

    function paint(t) {
      const w = canvas.width;
      const h = canvas.height;
      if (paperOnly) {
        ctx.fillStyle = '#f7f0e0';
        ctx.fillRect(0, 0, w, h);
        return;
      }
      const lamp = smoothstep(0.3, 2.8, t) * (1 - seg(t, 89, 95.5)) * (t > 52 && t < 70 ? 0.55 : 1);
      ctx.fillStyle = '#120c08';
      ctx.fillRect(0, 0, w, h);
      const pool = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.6);
      pool.addColorStop(0, `rgba(122, 76, 42, ${lamp})`);
      pool.addColorStop(1, 'rgba(18, 12, 8, 0)');
      ctx.fillStyle = pool;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 0.25 + 0.75 * lamp;
      const spread = [...SPREADS].reverse().find((s) => t >= s.start + 1.5);
      if (!spread) {
        ctx.fillStyle = '#7a2e2a';
        ctx.fillRect(w * 0.42, h * 0.3, w * 0.2, h * 0.42);
      } else {
        const [paperColor, a, b] = PAGES[spread.id];
        const x0 = w * 0.18;
        const x1 = w * 0.82;
        const y0 = h * 0.3;
        const y1 = h * 0.94;
        ctx.fillStyle = paperColor;
        ctx.beginPath();
        ctx.moveTo(x0 + w * 0.06, y0);
        ctx.lineTo(x1 - w * 0.06, y0);
        ctx.lineTo(x1, y1);
        ctx.lineTo(x0, y1);
        ctx.fill();
        for (let i = 0; i < 9; i++) {
          ctx.fillStyle = i % 2 ? a : b;
          const cx = x0 + ((i + 0.5) / 9) * (x1 - x0);
          ctx.beginPath();
          ctx.ellipse(cx, h * (0.45 + 0.04 * (i % 3)), w * 0.045, h * 0.14, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        ctx.fillRect(w * 0.497, y0, w * 0.006, y1 - y0);
      }
      ctx.globalAlpha = 1;
    }

    const scrub = document.getElementById('scrub');
    const range = document.getElementById('range');
    const pp = document.getElementById('pp');
    const label = document.getElementById('time');
    if (params.get('ui') !== '0') {
      scrub.hidden = false;
      range.addEventListener('input', () => player.seek(parseFloat(range.value)));
      pp.addEventListener('click', () => player.toggle());
    }

    resize();
    addEventListener('resize', resize);
    await document.fonts.ready;
    let frames = 0;
    function frame() {
      const t = player.time;
      paint(t);
      titles.update(t);
      if (!scrub.hidden) {
        range.value = String(t);
        label.textContent = t.toFixed(2);
        pp.textContent = player.playing ? 'Pause' : 'Play';
      }
      if (++frames >= 2) window.__ready = true;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
