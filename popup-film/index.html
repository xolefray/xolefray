<!doctype html>
<!--
  index.html — page shell of "The Little Paper Boat".
  Layers, bottom to top: #stage (WebGL canvas), #overlay (titles.js captions), #ui (player
  controls, ui.js) and #intro (static loading card that becomes the poster / "Begin" screen;
  main.js drives its data-state: loading -> poster -> leaving -> gone, or error).
  No external resources: vendored three.js via the import map, system fonts, inline SVG.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The Little Paper Boat — a 96-second real-time pop-up-book film. A folded paper boat sails through a forest, a sea, a lantern city and the morning sky.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0a09">
  <title>The Little Paper Boat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
  <link rel="modulepreload" href="vendor/three.module.js">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="stage" class="stage"></div>
  <div id="overlay" class="overlay"></div>
  <div id="ui" class="pb-ui" hidden></div>

  <section id="intro" class="intro" data-state="loading" aria-labelledby="intro-title">
    <div class="intro__card">
      <p class="intro__eyebrow">a pop-up film in four pages</p>
      <h1 class="intro__title" id="intro-title">The Little Paper Boat</h1>
      <div class="intro__rule" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 32 22" width="32" height="22">
          <path d="M2.5 13.5h27l-5 6h-17z M16 2.5l-6.5 11h13z M16 2.5v11" />
        </svg>
        <span></span>
      </div>
      <p class="intro__line">Open the book and follow a little paper boat through four folded worlds.</p>
      <div class="intro__action">
        <div class="intro__status" role="status">
          <span class="intro__fold" aria-hidden="true"></span>
          <span class="intro__status-text">folding paper…</span>
          <span class="intro__progress" aria-hidden="true"><i></i></span>
        </div>
        <button class="intro__begin" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l10-6.4c.6-.4.6-1.3 0-1.7l-10-6.4C8.9 4.3 8 4.8 8 5.6z" /></svg>
          Begin
        </button>
      </div>
      <p class="intro__hint">About a minute and a half · best with sound</p>
    </div>
  </section>

  <noscript><p class="noscript">This little film is drawn live in your browser and needs JavaScript to unfold.</p></noscript>
</body>
</html>
