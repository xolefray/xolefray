<!doctype html>
<!--
  index.html — page shell of "Our Love Story" (Brian & Marlin's wedding pop-up film).
  Layers, bottom to top: #stage (WebGL canvas), #overlay (titles.js captions), #ui (player
  controls, ui.js) and #intro (static loading card that becomes the poster / "Begin" screen;
  main.js drives its data-state: loading -> poster -> leaving -> gone, or error; the module
  script's onerror also shows the error state when the code cannot load at all, e.g. modules blocked
  by CORS in an opaque-origin sandboxed iframe).
  No external resources: vendored three.js via the import map, two vendored open-licence fonts
  (fonts/, @font-face in styles.css; preloaded here so the card and the canvases get them early),
  inline SVG. The couple's photos (photos/, private, not in the repository) are optional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Our Love Story — Brian &amp; Marlin. A four-and-a-half-minute pop-up scrapbook film about how they met, drawn live in your browser.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0a09">
  <title>Our Love Story</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/luckiest-guy-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/caveat-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
  <link rel="modulepreload" href="vendor/three.module.js">
  <script type="module" src="src/main.js" onerror="(function () {
    var show = function () {
      var intro = document.getElementById('intro');
      if (!intro) return;
      intro.dataset.state = 'error';
      intro.querySelector('.intro__status-text').textContent = 'The pages could not be loaded here. Please reload, or open the film in its own tab.';
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
    else show();
  })()"></script>
</head>
<body>
  <div id="stage" class="stage"></div>
  <div id="overlay" class="overlay"></div>
  <div id="ui" class="pb-ui" hidden></div>

  <section id="intro" class="intro" data-state="loading" aria-labelledby="intro-title">
    <div class="intro__card">
      <h1 class="intro__title" id="intro-title" aria-label="Our Love Story">
        <span class="intro__word" aria-hidden="true"><i>O</i><i>U</i><i>R</i></span>
        <span class="intro__word" aria-hidden="true"><i>L</i><i>O</i><i>V</i><i>E</i></span>
        <span class="intro__word" aria-hidden="true"><i>S</i><i>T</i><i>O</i><i>R</i><i>Y</i></span>
      </h1>
      <p class="intro__names">Brian &amp; Marlin</p>
      <div class="intro__rule" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 24 22" width="22" height="20">
          <path d="M12 20C5.5 15 2 11.4 2 7.4 2 4.4 4.3 2.4 6.9 2.4c1.9 0 3.7 1 5.1 2.9 1.4-1.9 3.2-2.9 5.1-2.9 2.6 0 4.9 2 4.9 5 0 4-3.5 7.6-10 12.6z" />
        </svg>
        <span></span>
      </div>
      <p class="intro__line">Open the scrapbook and see how it all began.</p>
      <div class="intro__action">
        <div class="intro__status" role="status">
          <span class="intro__fold" aria-hidden="true"></span>
          <span class="intro__status-text">gluing in the photos…</span>
          <span class="intro__progress" aria-hidden="true"><i></i></span>
        </div>
        <button class="intro__begin" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l10-6.4c.6-.4.6-1.3 0-1.7l-10-6.4C8.9 4.3 8 4.8 8 5.6z" /></svg>
          Begin
        </button>
      </div>
      <p class="intro__hint">About four and a half minutes · best with sound</p>
    </div>
  </section>

  <noscript><p class="noscript">This little film is drawn live in your browser and needs JavaScript to unfold.</p></noscript>
</body>
</html>
