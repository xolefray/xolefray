<!doctype html>
<!--
  dev/audio.html — measurement harness for src/audio.js.
  Renders the film (0–DURATION, from timeline.js) offline at 22.05 kHz in chunks with renderOffline(), plus short
  foley-only windows and a ducked music window. Computes per-second and per-chapter peak/RMS
  (dBFS), checks peak ≤ −3 dBFS, audible chapters, turn foley, silence after DURATION − 0.5,
  and the 6 dB narration duck. Exercises the live API. Logs a compact table with console.info,
  draws the level plot, sets window.__audioStats and window.__ready.
  ?quick=1 renders only the loud, quiet and tail windows (for tuning). Needs a click to listen.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Love Story — score</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
  <style>
    :root { --bg: #14110f; --panel: #1e1a17; --ink: #efe6d6; --dim: #9b8f7f; --rms: #d9a441; --peak: #f3d9a4;
            --foley: #6fb3d2; --bad: #e0614f; --good: #7cc47f; --grid: #3a332d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
    p.sub { margin: 0 0 8px; color: var(--dim); }
    canvas { width: 100%; height: 200px; display: block; background: var(--panel); border-radius: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
    button { background: var(--panel); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px;
             padding: 4px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--rms); }
    #clock { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 5em; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin: 6px 0; font-size: 12px; }
    th, td { text-align: right; padding: 2px 8px; border-bottom: 1px solid var(--grid); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--dim); font-weight: 500; }
    ul { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 12px; }
    li { padding: 1px 0; break-inside: avoid; }
    .ok { color: var(--good); } .bad { color: var(--bad); }
    .legend span { margin-right: 14px; color: var(--dim); font-size: 12px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body>
  <main>
    <h1>Our Love Story — score &amp; foley</h1>
    <p class="sub" id="status">Rendering offline…</p>
    <canvas id="plot" width="2000" height="420"></canvas>
    <div class="legend">
      <span><i style="background:var(--rms)"></i>RMS</span>
      <span><i style="background:var(--peak)"></i>peak</span>
      <span><i style="background:var(--bad)"></i>−3 dBFS</span>
    </div>
    <div class="row" id="transport">
      <button id="play" type="button">Play</button>
      <button id="mute" type="button">Mute</button>
      <span id="clock">0.0 s</span>
    </div>
    <table id="chapters"></table>
    <ul id="checks"></ul>
  </main>
  <script type="module">
    import { createAudio, renderOffline } from '../src/audio.js';
    import { CHAPTERS, LEAF_TURNS, DURATION, BEATS, NARRATION, END_CARD, Player } from '../src/timeline.js';

    const SR = 22050;
    const SILENCE_AT = DURATION - 0.5;
    const QUICK = new URLSearchParams(location.search).get('quick') === '1';
    const db = (x) => (x > 1e-8 ? 20 * Math.log10(x) : -120);
    const f1 = (x) => (x <= -119 ? '  -inf' : x.toFixed(1).padStart(6));
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const $ = (id) => document.getElementById(id);

    const SHORT = {
      Cover: 'Cover',
      Portada: 'Cover',
      'Where it all began': 'Walmart',
      'Donde todo comenzó': 'Walmart',
      'Lunch breaks': 'Lunch',
      'La hora del almuerzo': 'Lunch',
      'Creative dates': 'Dates',
      'Citas creativas': 'Dates',
      'A little bit of fate': 'Fate',
      'Un poquito de destino': 'Fate',
      'February 7, 2024': 'Official',
      '7 de febrero de 2024': 'Official',
      'Building our life': 'Life',
      'Construyendo nuestra vida': 'Life',
      'On her birthday': 'Proposal',
      'En su cumpleaños': 'Proposal',
      'February 6, 2027': 'Wedding',
      '6 de febrero de 2027': 'Wedding',
      'See you there': 'End',
      'Nos vemos ahí': 'End',
    };
    const short = (label) => SHORT[label] || (label.toLowerCase().includes('date') ? 'Dates' : label.slice(0, 10));

    /** Peak / RMS of buf over [t0, t1) in buffer seconds. Also returns linear energy for stitching. */
    function measure(buf, t0, t1) {
      const a = Math.max(0, Math.floor(t0 * buf.sampleRate));
      const b = Math.min(buf.length, Math.ceil(t1 * buf.sampleRate));
      let peak = 0, sum = 0, bad = 0, n = 0;
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const d = buf.getChannelData(c);
        for (let i = a; i < b; i++) {
          const v = d[i];
          if (!Number.isFinite(v)) { bad++; continue; }
          const m = Math.abs(v);
          if (m > peak) peak = m;
          sum += v * v;
          n++;
        }
      }
      return { peak: db(peak), rms: db(Math.sqrt(sum / Math.max(1, n))), bad, peakLin: peak, sum, n };
    }

    function combine(parts) {
      let peak = 0, sum = 0, n = 0, bad = 0;
      for (const p of parts) {
        if (p.peakLin > peak) peak = p.peakLin;
        sum += p.sum; n += p.n; bad += p.bad;
      }
      return { peak: db(peak), rms: db(Math.sqrt(sum / Math.max(1, n))), bad, peakLin: peak, sum, n };
    }

    /**
     * Render [from, to) in chunks. Each chunk after the first overlaps by `overlap` seconds so
     * bell tails and the reverb of the previous chunk are present in the kept region.
     */
    async function renderSpan(from, to, opts, { chunk = 24, overlap = 2, step = 1 } = {}) {
      const rows = [];
      let t = from;
      while (t < to - 1e-4) {
        const keepEnd = Math.min(to, t + chunk);
        const renderFrom = t === from ? from : Math.max(from, t - overlap);
        const buf = await renderOffline(renderFrom, keepEnd, SR, opts);
        if (!buf) throw new Error('OfflineAudioContext unavailable');
        for (let s = t; s < keepEnd - 1e-4; s += step) {
          const a = s - renderFrom;
          const b = Math.min(s + step, keepEnd) - renderFrom;
          rows.push({ t: s, ...measure(buf, a, b) });
        }
        $('status').textContent = `Rendering ${opts?.layers?.join('+') || 'mix'}${opts?.duck ? ' ducked' : ''}… ${keepEnd.toFixed(0)} / ${to.toFixed(0)} s`;
        t = keepEnd;
        await sleep(0);
      }
      return rows;
    }

    function drawPlot(fine) {
      const cv = $('plot');
      const g = cv.getContext('2d');
      const W = cv.width, H = cv.height, padL = 64, padB = 36, top = 14;
      const x = (t) => padL + ((W - padL - 12) * t) / DURATION;
      const y = (d) => top + ((H - top - padB) * Math.min(60, Math.max(0, -d))) / 60;
      const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      g.clearRect(0, 0, W, H);
      g.font = '20px system-ui';
      for (const turn of LEAF_TURNS) {
        g.fillStyle = 'rgba(255,255,255,0.05)';
        g.fillRect(x(turn.start), top, Math.max(1, x(turn.end) - x(turn.start)), H - top - padB);
      }
      g.strokeStyle = css('--grid');
      g.lineWidth = 1;
      for (let d = 0; d >= -60; d -= 12) {
        g.beginPath(); g.moveTo(padL, y(d)); g.lineTo(W - 12, y(d)); g.stroke();
        g.fillStyle = css('--dim'); g.fillText(`${d}`, 8, y(d) + 6);
      }
      for (const ch of CHAPTERS) {
        g.beginPath(); g.moveTo(x(ch.t), top); g.lineTo(x(ch.t), H - padB); g.stroke();
        g.fillStyle = css('--dim');
        g.fillText(short(ch.label), x(ch.t) + 4, H - 10);
      }
      g.fillStyle = css('--rms');
      g.beginPath(); g.moveTo(x(fine[0]?.t ?? 0), y(-60));
      for (const r of fine) g.lineTo(x(r.t), y(r.rms));
      g.lineTo(x(DURATION), y(-60)); g.closePath(); g.fill();
      g.strokeStyle = css('--peak'); g.lineWidth = 1.5; g.beginPath();
      fine.forEach((r, i) => (i ? g.lineTo(x(r.t), y(r.peak)) : g.moveTo(x(r.t), y(r.peak))));
      g.stroke();
      g.strokeStyle = css('--bad'); g.setLineDash([8, 6]); g.beginPath();
      g.moveTo(padL, y(-3)); g.lineTo(W - 12, y(-3)); g.stroke(); g.setLineDash([]);
    }

    async function drive(audio, clock, seconds, playing = true) {
      const t0 = performance.now();
      let last = t0;
      while (performance.now() - t0 < seconds * 1000) {
        const now = performance.now();
        if (playing) clock.t += (now - last) / 1000;
        last = now;
        audio.sync(clock.t, playing);
        await sleep(16);
      }
    }

    async function liveTest() {
      const res = { ok: true, errors: [], steps: [] };
      const note = (name, audio) => res.steps.push({ name, ...audio.stats });
      try {
        const saved = [window.AudioContext, window.webkitAudioContext];
        window.AudioContext = undefined;
        window.webkitAudioContext = undefined;
        try {
          const dead = createAudio();
          dead.sync(3, true);
          await dead.start();
          dead.sync(4, true);
          dead.setMuted(true);
          dead.sync(5, false);
          res.noWebAudio = { state: dead.stats.state, muted: dead.muted };
        } finally {
          [window.AudioContext, window.webkitAudioContext] = saved;
        }
        const audio = createAudio();
        audio.sync(1, true);
        await audio.start();
        const clock = { t: 2.2 };
        await drive(audio, clock, 0.7); note('play cover', audio);
        clock.t = 10.2;
        await drive(audio, clock, 0.45); note('seek to page turn', audio);
        for (let k = 0; k < 8; k++) { audio.sync(30 + k * 2.2, true); await sleep(16); }
        note('scrub', audio);
        await drive(audio, clock, 0.35, false); note('paused', audio);
        clock.t = 74;
        await drive(audio, clock, 0.45); note('resume official', audio);
        audio.setMuted(true);
        await drive(audio, clock, 0.15);
        audio.setMuted(false);
        note('mute', audio);
        clock.t = 151.2;
        await drive(audio, clock, 0.4); note('near end', audio);
        audio.sync(DURATION, false); note('stopped', audio);
        res.narration = audio.narration;
        const s = res.steps;
        res.running = audio.stats.state === 'running';
        if (res.running) {
          const expect = (cond, msg) => { if (!cond) { res.ok = false; res.errors.push(msg); } };
          expect(s[0].sessions === 1 && s[0].scheduled > 0, 'playback did not schedule');
          expect(s[1].sessions === 2, 'seek did not restart the session');
          expect(s[2].sessions <= 4, 'scrubbing spawned too many sessions');
          expect(s[3].live === 0, 'pause left sources playing');
          expect(s[4].sessions > s[3].sessions, 'resume did not restart');
          expect(s[7].live === 0, 'end did not stop playback');
        }
      } catch (err) {
        res.ok = false;
        res.errors.push(String(err && err.stack ? err.stack : err));
      }
      return res;
    }

    function setupTransport() {
      const audio = createAudio();
      const player = new Player(DURATION);
      const row = $('transport');
      for (const ch of CHAPTERS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = short(ch.label);
        b.addEventListener('click', () => { audio.start(); player.seek(ch.t); player.play(); });
        row.insertBefore(b, $('clock'));
      }
      $('play').addEventListener('click', () => { audio.start(); player.toggle(); });
      $('mute').addEventListener('click', () => {
        audio.setMuted(!audio.muted);
        $('mute').textContent = audio.muted ? 'Unmute' : 'Mute';
      });
      const tick = () => {
        audio.sync(player.time, player.playing);
        $('clock').textContent = `${player.time.toFixed(1)} s`;
        $('play').textContent = player.playing ? 'Pause' : 'Play';
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      return audio;
    }

    async function foleyWindow(label, t0, t1) {
      const buf = await renderOffline(t0, t1, SR, { layers: ['foley'] });
      if (!buf) throw new Error('no offline context');
      const m = measure(buf, 0, t1 - t0);
      return { label, at: t0, peak: m.peak, rms: m.rms, bad: m.bad };
    }

    async function run() {
      const transport = setupTransport();
      const t0 = performance.now();
      let perSecond;
      let fine;
      if (QUICK) {
        const windows = [[0, 8], [26, 30], [56, 64], [108, 120], [123, 132], [148, DURATION]];
        perSecond = [];
        fine = [];
        for (const [a, b] of windows) {
          const rows = await renderSpan(a, b, null, { chunk: b - a, overlap: 0, step: 0.5 });
          fine.push(...rows);
          perSecond.push(...rows.filter((_, i) => i % 2 === 0));
        }
      } else {
        fine = await renderSpan(0, DURATION, null, { chunk: 24, overlap: 2, step: 0.25 });
        perSecond = [];
        for (let s = 0; s < DURATION - 1e-4; s += 1) {
          const slice = fine.filter((r) => r.t >= s && r.t < s + 1);
          perSecond.push({ t: s, ...combine(slice) });
        }
      }
      const renderMs = Math.round(performance.now() - t0);
      drawPlot(fine);

      const audibleRows = perSecond.filter((r) => r.t < END_CARD.fadeStart);
      const overall = combine(perSecond);
      const chapters = CHAPTERS.map((ch, i) => {
        const end = CHAPTERS[i + 1]?.t ?? DURATION;
        const rows = perSecond.filter((r) => r.t >= ch.t && r.t < end && r.t < END_CARD.fadeStart);
        const all = perSecond.filter((r) => r.t >= ch.t && r.t < end);
        const body = rows.length ? combine(rows) : combine(all);
        const quietest = rows.length ? Math.min(...rows.map((r) => r.rms)) : body.rms;
        return { label: ch.label, short: short(ch.label), from: ch.t, to: end, peak: body.peak, rms: body.rms, quietest };
      });

      const turns = [];
      for (const tr of LEAF_TURNS) {
        const onset = await foleyWindow(`leaf ${tr.leaf} onset`, tr.start, tr.start + 0.35);
        const whole = await foleyWindow(`leaf ${tr.leaf} turn`, tr.start, tr.end);
        turns.push({ label: `leaf ${tr.leaf}`, at: tr.start, onset: onset.peak, peak: whole.peak, rms: whole.rms });
      }
      const lamp = await foleyWindow('lamp', BEATS.lampOn - 0.02, BEATS.lampOn + 0.2);
      const stamp = await foleyWindow('stamp', BEATS.official - 0.02, BEATS.official + 0.25);
      const shutter = await foleyWindow('shutter', BEATS.photoReveal - 0.02, BEATS.photoReveal + 0.12);
      const pop = await foleyWindow('pop', BEATS.yes - 0.02, BEATS.yes + 0.2);

      // The fade reaches 0 at DURATION − 0.5. Measure only from there, not the whole last second.
      const tailRows = fine.filter((r) => r.t >= SILENCE_AT - 1e-6);
      const tail = tailRows.length ? combine(tailRows) : { peak: -120, rms: -120, bad: 0 };

      // Duck: music only, over a long narration line and over a gap between lines.
      // Windows come from NARRATION (0.25 s ramps, same as audio.js), not a fixed clock.
      const RAMP = 0.25;
      let duckLine = null;
      let gapA = 0;
      let gapB = 0;
      for (let i = 0; i < NARRATION.length - 1; i++) {
        const prev = NARRATION[i];
        const next = NARRATION[i + 1];
        const g0 = prev.end + RAMP;
        const g1 = next.start;
        const span = next.end - next.start;
        if (g1 - g0 >= 0.7 && span >= 5) {
          duckLine = next;
          gapA = g0 + 0.08;
          gapB = g1 - 0.08;
          break;
        }
      }
      if (!duckLine) duckLine = NARRATION[NARRATION.length - 1];
      const lineA = duckLine.start + RAMP + 0.2;
      const lineB = duckLine.end - 0.2;
      const duckFrom = Math.min(gapA || lineA, lineA) - 0.4;
      const duckTo = Math.max(gapB || lineB, lineB) + 0.4;
      const dryBuf = await renderOffline(duckFrom, duckTo, SR, { layers: ['music'], duck: false });
      const wetBuf = await renderOffline(duckFrom, duckTo, SR, { layers: ['music'], duck: true });
      const rel = (buf, a, b) => measure(buf, a - duckFrom, b - duckFrom);
      const lineDry = rel(dryBuf, lineA, lineB);
      const lineWet = rel(wetBuf, lineA, lineB);
      const gapDry = rel(dryBuf, gapA, gapB);
      const gapWet = rel(wetBuf, gapA, gapB);
      const lineDelta = lineDry.rms - lineWet.rms;
      const gapDelta = gapDry.rms - gapWet.rms;
      const duck = {
        line: { dry: lineDry.rms, wet: lineWet.rms, delta: lineDelta },
        gap: { dry: gapDry.rms, wet: gapWet.rms, delta: gapDelta },
      };

      const live = await liveTest();
      // The transport instance started the shared probe at load; give it a tick if still pending.
      await sleep(30);
      const narration = transport.narration;

      const holes = audibleRows.filter((r) => r.rms < -48 && !(r.t >= BEATS.kneel - 0.2 && r.t < BEATS.yes)).map((r) => r.t);
      const checks = [
        { name: `overall peak ${overall.peak.toFixed(1)} dBFS ≤ −3`, ok: overall.peak <= -3 && overall.peak > -40 },
        { name: `no non-finite samples (${overall.bad})`, ok: overall.bad === 0 },
        ...chapters.map((c) => ({ name: `${c.short} peak ${c.peak.toFixed(1)} dBFS audible`, ok: c.peak >= -36 })),
        ...turns.map((tr) => ({ name: `${tr.label} @ ${tr.at}s onset ${tr.onset.toFixed(1)} / turn ${tr.peak.toFixed(1)} dBFS`, ok: tr.onset >= -30 && tr.peak >= -30 })),
        { name: `lamp ${lamp.peak.toFixed(1)} dBFS`, ok: lamp.peak >= -30 },
        { name: `stamp ${stamp.peak.toFixed(1)} shutter ${shutter.peak.toFixed(1)} pop ${pop.peak.toFixed(1)} dBFS`, ok: stamp.peak >= -28 && shutter.peak >= -28 && pop.peak >= -28 },
        { name: `silence after ${SILENCE_AT}s: peak ${tail.peak.toFixed(1)} dBFS ≤ −60`, ok: tail.peak <= -60 },
        { name: `duck under ${duckLine.id}: ${lineDelta.toFixed(1)} dB (dry ${lineDry.rms.toFixed(1)} → wet ${lineWet.rms.toFixed(1)})`, ok: lineDelta >= 4.2 && lineDelta <= 7.5 },
        { name: `no duck in the gap: Δ ${gapDelta.toFixed(1)} dB`, ok: Math.abs(gapDelta) <= 1.5 },
        { name: `narration file: ${narration} (missing is expected)`, ok: narration === 'absent' || narration === 'ready' },
        { name: `live API: ${live.running ? 'running' : 'no autoplay'} ${live.ok ? 'no errors' : live.errors.join('; ')}`, ok: live.ok },
      ];
      if (!QUICK && holes.length) {
        checks.push({ name: `quiet seconds outside the kneel (RMS < −48): ${holes.join(', ')}`, ok: false });
      }

      $('chapters').innerHTML =
        '<tr><th>chapter</th><th>from</th><th>to</th><th>peak</th><th>RMS</th><th>quietest s</th></tr>' +
        chapters.map((c) => `<tr><td>${c.label}</td><td>${c.from}</td><td>${c.to}</td><td>${c.peak.toFixed(1)}</td><td>${c.rms.toFixed(1)}</td><td>${Number.isFinite(c.quietest) ? c.quietest.toFixed(1) : ''}</td></tr>`).join('');
      $('checks').innerHTML = checks.map((c) => `<li class="${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'} ${c.name}</li>`).join('');
      const ok = checks.every((c) => c.ok);
      $('status').textContent = `${ok ? 'OK' : 'CHECK FAILED'} · ${QUICK ? 'quick ' : ''}${renderMs} ms render · peak ${overall.peak.toFixed(1)} dBFS · duck ${lineDelta.toFixed(1)} dB · tail ${tail.peak.toFixed(1)}`;

      console.info(`[audio] render ${renderMs} ms @ ${SR} Hz · peak ${f1(overall.peak)} rms ${f1(overall.rms)} tail ${f1(tail.peak)} duck ${lineDelta.toFixed(2)} (gap ${gapDelta.toFixed(2)})`);
      console.info('[audio] chapter            peak    rms  quietest\n' +
        chapters.map((c) => `[audio] ${c.short.padEnd(16)} ${f1(c.peak)} ${f1(c.rms)} ${f1(c.quietest)}`).join('\n'));
      const shown = QUICK ? perSecond : perSecond.filter((_, i) => i % 1 === 0);
      console.info('[audio] per-second peak/rms\n' + Array.from({ length: Math.ceil(shown.length / 10) }, (_, row) => {
        const slice = shown.slice(row * 10, row * 10 + 10);
        return `[audio] ${String(slice[0].t).padStart(3)}s ` + slice.map((r) => `${r.peak.toFixed(0)}/${r.rms.toFixed(0)}`.padStart(9)).join('');
      }).join('\n'));
      console.info('[audio] foley ' + turns.map((tr) => `${tr.label}@${tr.at}: onset ${tr.onset.toFixed(1)} turn ${tr.peak.toFixed(1)}`).join(' · ')
        + ` · lamp ${lamp.peak.toFixed(1)} stamp ${stamp.peak.toFixed(1)} shutter ${shutter.peak.toFixed(1)} pop ${pop.peak.toFixed(1)}`);
      console.info('[audio] checks ' + checks.map((c) => `${c.ok ? 'ok' : 'FAIL'}: ${c.name}`).join(' | '));

      window.__audioStats = {
        sampleRate: SR, renderMs, quick: QUICK, overall, chapters, turns, lamp, stamp, shutter, pop,
        holes, tail, duck, live, narration,
        perSecond: perSecond.map((r) => ({ t: +r.t.toFixed(2), peak: +r.peak.toFixed(1), rms: +r.rms.toFixed(1) })),
        checks, ok,
      };
      window.__ready = true;
    }

    run().catch((err) => {
      $('status').textContent = `Error: ${err.message}`;
      console.error(err);
      window.__audioStats = { ok: false, error: String(err && err.stack ? err.stack : err) };
      window.__ready = true;
    });
  </script>
</body>
</html>
