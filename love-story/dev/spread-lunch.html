<!doctype html>
<!--
  dev/spread-lunch.html — the lunch spread, alone in its spread frame.
  ?alpha=  units of π, default 1. "film" = the timeline's α at t.
  ?t=      film seconds (default: the spread's open time).
  ?view=   front | wide | low | top | board | table | clock | laugh | photo | sparks
  ?play=1  advance t.  ?free=1 orbit.  ?ui=0 hide the HUD.
  ?check=1 fold self-test (α from π to 0, and every 0.1 s of the open window).
           Prints "lunch fold check: PASS" or FAIL. Sets window.__ready.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch spread</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; }
    #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: #f3ead8; opacity: 0.85; pointer-events: none; white-space: pre-wrap; max-width: 70ch; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
  <div id="hud"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as paper from '../src/paper.js';
    import * as popup from '../src/popup.js';
    import * as figuresMod from '../src/figures.js';
    import { resolveFigures } from '../src/util/figures-fallback.js';
    import { loadCharacters } from '../src/characters.js';
    import * as characterArt from '../src/characters.js';
    import { loadPhotos } from '../src/photos.js';
    import { FONT, loadFonts } from '../src/fonts.js';
    import { createEnvironment } from '../src/environment.js';
    import { makeRng } from '../src/util/rng.js';
    import { BOOK } from '../src/book.js';
    import { PAGE_W, PAGE_D } from '../src/dims.js';
    import * as timeline from '../src/timeline.js';
    import lunch from '../src/spreads/lunch.js';

    const PI = Math.PI;
    const LIFT = 0.14;
    const spread = timeline.SPREADS.find((s) => s.id === 'lunch');
    const params = new URLSearchParams(location.search);
    const num = (k, d) => (params.has(k) && Number.isFinite(Number(params.get(k))) ? Number(params.get(k)) : d);
    const t0 = num('t', spread.open);
    const view = params.get('view') ?? 'front';
    const play = params.get('play') === '1';
    const filmAlpha = params.get('alpha') === 'film';
    const alphaFixed = PI * Math.min(1, Math.max(0, num('alpha', 1)));
    const phis = timeline.leafAngles(0);
    const alphaAt = (t) => (filmAlpha ? timeline.spreadAlpha(spread.k, timeline.leafAngles(t, phis)) : alphaFixed);

    await loadFonts();
    const [photos, characters, art] = await Promise.all([
      loadPhotos(),
      loadCharacters({ base: '../characters/' }),
      loadCharacters({ base: '../art/lunch/' }),
    ]);
    const figures = resolveFigures(figuresMod, paper);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 80);
    const env = createEnvironment({ scene, renderer });

    const frame = new THREE.Group();
    frame.position.y = LIFT;
    scene.add(frame);

    const api = lunch.build({
      THREE, paper, popup, rng: makeRng(1002), BOOK,
      photos, figures, characters, characterArt, art, FONT, timeline,
    });

    const pageGeo = (x) => new THREE.PlaneGeometry(PAGE_W, PAGE_D).rotateX(-PI / 2).translate(x, 0, 0);
    const right = new THREE.Mesh(pageGeo(PAGE_W / 2), paper.paperMaterial({ map: paper.texture(api.rightArt) }));
    right.receiveShadow = true;
    frame.add(right);
    const hinge = new THREE.Group();
    frame.add(hinge);
    const left = new THREE.Mesh(pageGeo(-PAGE_W / 2), paper.paperMaterial({ map: paper.texture(api.leftArt) }));
    left.receiveShadow = true;
    hinge.add(left);
    frame.add(api.group);

    const VIEWS = {
      front: [[0, 3.2, 8.2], [0, 0.8, 0]],
      wide: [[0.4, 4.6, 8.4], [0, 0.55, 0]],
      low: [[0.2, 0.7, 4.8], [0, 0.65, 0.15]],
      top: [[0, 8.5, 0.4], [0, 0, 0]],
      board: [[-1.35, 1.9, 1.35], [-1.32, 1.05, -1.15]],
      table: [[1.7, 1.45, 3.2], [1.8, 0.95, 0.55]],
      clock: [[1.05, 1.15, 1.4], [1.08, 0.52, -1.15]],
      laugh: [[1.7, 1.7, 2.9], [1.8, 1.15, 0.6]],
      photo: [[2.35, 1.45, 2.7], [2.32, 1.08, 0.85]],
      sparks: [[1.85, 1.25, 2.4], [1.8, 1.15, 0.6]],
    };
    const target = new THREE.Vector3();
    let controls = null;
    function aim() {
      const [p, q] = VIEWS[view] ?? VIEWS.front;
      camera.position.set(p[0], p[1] + LIFT, p[2]);
      target.set(q[0], q[1] + LIFT, q[2]);
      camera.lookAt(target);
    }
    aim();
    if (params.get('free') === '1') {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(target);
      controls.update();
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let meshes = 0;
    api.group.traverse((o) => { if (o.isMesh) meshes++; });

    function label(obj) {
      let o = obj;
      while (o && !o.name) o = o.parent;
      return (o && o.name) || 'piece';
    }
    function inside(p, al) {
      if (p.y < -0.03) return false;
      if (Math.abs(p.z) > 1.51) return false;
      if (p.y < 0.025 && Math.abs(p.x) < 0.04) return true;
      const y = p.y < 0 ? 0 : p.y;
      if (al < 0.02) {
        if (y > 0.045) return false;
        if (p.x < -0.06 || p.x > PAGE_W + 0.06) return false;
        return true;
      }
      const ang = Math.atan2(y, p.x);
      if (ang < -0.03 || ang > al + 0.03) return false;
      if (al < 0.25 && Math.hypot(p.x, y) > PAGE_W + 0.06) return false;
      return true;
    }
    function foldCheck() {
      const v = new THREE.Vector3();
      const problems = [];
      const seen = new Set();
      const sample = (al, t) => {
        if (problems.length >= 8) return;
        api.update(al, t);
        frame.updateMatrixWorld(true);
        api.group.traverse((obj) => {
          if (problems.length >= 8 || !obj.isMesh || !obj.geometry?.attributes?.position) return;
          const pos = obj.geometry.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
            v.y -= LIFT;
            if (inside(v, al)) continue;
            const key = `${label(obj)}@${al.toFixed(3)}@${t.toFixed(1)}`;
            if (seen.has(key)) break;
            seen.add(key);
            problems.push(`${label(obj)} α=${(al / PI).toFixed(2)}π t=${t.toFixed(1)} (${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)})`);
            break;
          }
        });
      };
      const mid = (spread.open + spread.close) / 2;
      const hours = timeline.BEATS.hoursTalking + 1.4;
      const dated = timeline.BEATS.ourThing + 2;
      const warm = timeline.BEATS.sparks + 1;
      const angles = [PI, 0.6 * PI, 0.3 * PI, 0.1 * PI, 0];
      for (let i = 0; i <= 18; i++) angles.push(PI * (1 - i / 18));
      for (const al of angles) {
        sample(al, mid);
        sample(al, hours);
        sample(al, dated);
        sample(al, warm);
      }
      for (let t = spread.open; t <= spread.close + 1e-6; t += 0.1) sample(PI, t);
      if (problems.length) {
        console.error(`lunch fold check: FAIL ${problems.length}+ — ${problems.join(' | ')}`);
        return `FAIL ${problems.length}`;
      }
      console.log(`lunch fold check: PASS (${meshes} meshes)`);
      return 'PASS';
    }
    const selfTest = params.get('check') === '1' ? foldCheck() : 'check off';

    const hud = document.getElementById('hud');
    hud.hidden = params.get('ui') === '0';
    const clock0 = performance.now();
    let frames = 0;
    renderer.setAnimationLoop(() => {
      const t = play ? t0 + (performance.now() - clock0) / 1000 : t0;
      const alpha = alphaAt(t);
      hinge.rotation.z = alpha - PI;
      env.update(t);
      api.update(alpha, t, t - spread.start);
      if (!controls) aim();
      renderer.render(scene, camera);
      hud.textContent = `t ${t.toFixed(2)}  α ${(alpha / PI).toFixed(2)}π  view ${view}\n${meshes} meshes  ·  ${selfTest}`;
      if (++frames >= 2) window.__ready = true;
    });
  </script>
</body>
</html>
