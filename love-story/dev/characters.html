<!doctype html>
<!--
  dev/characters.html — harness for src/characters.js.

  Stands every loaded drawing on a page as a die-cut card, flips each cycle at 3 fps
  (frame = floor(t * 3); snap passes ?t=), and places one actor() whose drawing is
  missing so the paper-doll fallback is on the page too.

  ?t=<seconds>   pose the flip-books there and hold (also what snap sends)
  ?ui=0          hold still (snap). Without it, and without ?t=, the cycles play.
  ?cam=wide|close|side
  ?free=1        orbit controls
  ?chars=0       load nothing; only the fallback actor remains
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>character art</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b130e; }
    canvas { display: block; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as paper from '../src/paper.js';
    import * as figures from '../src/figures.js';
    import { loadCharacters, characterCard, characterFlip, actor } from '../src/characters.js';

    const q = new URLSearchParams(location.search);
    const tRaw = Number(q.get('t'));
    const time = Number.isFinite(tRaw) ? tRaw : 0;
    const still = q.get('ui') === '0' || Number.isFinite(tRaw);
    const BORDER = 16; // px; the test cut-outs keep 24 px of padding, so the rim is not clipped
    const flip = q.get('flip') === '1';
    const FPS = 3;
    const GAP = 0.34;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1b130e');

    const desk = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      paper.paperMaterial({ color: '#3a291c', roughness: 0.85 }),
    );
    desk.rotation.x = -Math.PI / 2;
    desk.position.y = -0.02;
    desk.receiveShadow = true;
    scene.add(desk);

    const pageArt = paper.page((ctx, w, h) => {
      ctx.strokeStyle = 'rgba(120, 90, 60, 0.3)';
      ctx.lineWidth = 5;
      ctx.strokeRect(28, 28, w - 56, h - 56);
    }, { seed: 4, tint: '#f4ead6' });
    const pageTex = paper.texture(pageArt);
    const PAGE_W = 8.6;
    const PAGE_D = 3.6;
    const page = new THREE.Mesh(
      new THREE.PlaneGeometry(PAGE_W, PAGE_D),
      paper.paperMaterial({ map: pageTex, roughness: 0.94 }),
    );
    page.rotation.x = -Math.PI / 2;
    page.receiveShadow = true;
    scene.add(page);

    const spot = new THREE.SpotLight('#ffd6a3', 280, 0, 0.62, 0.55, 1.6);
    spot.position.set(-2.4, 6.4, 4.2);
    spot.target.position.set(0, 0, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(2048, 2048);
    spot.shadow.bias = -0.0004;
    spot.shadow.normalBias = 0.012;
    spot.shadow.camera.near = 2;
    spot.shadow.camera.far = 16;
    scene.add(spot, spot.target);
    scene.add(new THREE.HemisphereLight('#ffe9cf', '#5a4030', 0.9));

    function labelMesh(text, width) {
      const { canvas, ctx } = paper.makeCanvas(640, 120);
      ctx.fillStyle = '#fbf7ee';
      ctx.fillRect(0, 0, 640, 120);
      ctx.strokeStyle = 'rgba(90, 70, 50, 0.4)';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 632, 112);
      ctx.fillStyle = '#3a2f2a';
      ctx.font = '600 54px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 320, 64);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, width * (120 / 640)),
        new THREE.MeshBasicMaterial({ map: paper.texture(canvas) }),
      );
      mesh.rotation.x = -Math.PI / 2;
      return mesh;
    }

    const chars = await loadCharacters({ base: '../characters/' });
    const row = new THREE.Group();
    scene.add(row);

    const pieces = [];
    const pushCard = (group, overhang, width, label) => {
      if (!group) return;
      pieces.push({ group, overhang, width, label });
    };

    for (const id of chars.ids) {
      const card = characterCard(paper, chars, id, { border: BORDER, flip });
      if (!card) continue;
      const info = chars.info(id);
      const s = card.userData.height / info.h;
      const overhang = (flip ? info.w - info.feet[0] : info.feet[0]) * s;
      pushCard(card, overhang, card.userData.width, id);
    }

    const flips = [];
    let flipX = 0;
    const cycleNames = new Set();
    for (const id of chars.ids) {
      const cyc = chars.info(id)?.cycle;
      if (cyc) cycleNames.add(cyc);
    }
    for (const name of cycleNames) {
      const ids = chars.cycle(name);
      const book = characterFlip(paper, chars, ids, { border: BORDER, flip });
      if (!book) continue;
      const info = chars.info(ids[0]);
      const sample = book.group.children[0];
      const s = sample.userData.height / info.h;
      // Mirrored feet sit at w - fx, which is the overhang once the card is flipped.
      const overhang = (flip ? info.w - info.feet[0] : info.feet[0]) * s;
      flips.push(book);
      pushCard(book.group, overhang, sample.userData.width, `${name} · flip`);
    }

    const standIn = actor(
      paper,
      chars,
      figures,
      'no-such-drawing',
      { who: 'sister', outfit: 'casual', pose: 'wave' },
      { border: BORDER },
    );
    if (standIn) {
      const w = standIn.userData.width ?? 0.4;
      pushCard(standIn, w / 2, w, 'fallback · sister');
    }

    let cursor = 0;
    for (const p of pieces) {
      p.group.position.set(cursor + p.overhang, 0, 0);
      row.add(p.group);
      const labW = Math.min(0.92, Math.max(0.62, p.width));
      const lab = labelMesh(p.label, labW);
      lab.position.set(cursor + p.width / 2, 0.006, 0.5);
      row.add(lab);
      if (p.label.endsWith('flip')) flipX = p.group.position.x;
      cursor += Math.max(p.width, labW) + GAP;
    }
    const total = Math.max(0, cursor - GAP);
    row.position.x = -total / 2;
    flipX += row.position.x;

    // A rule on the page just in front of the toes: feet should meet it.
    const rule = new THREE.Mesh(
      new THREE.BoxGeometry(Math.max(1.2, total + 0.4), 0.003, 0.012),
      new THREE.MeshBasicMaterial({ color: '#8d6244' }),
    );
    rule.position.set(0, 0.004, 0.22);
    scene.add(rule);

    function poseFlips(t) {
      const frame = Math.floor(Math.max(0, t) * FPS);
      for (let i = 0; i < flips.length; i++) flips[i].show(frame);
    }
    poseFlips(time);

    const look = new THREE.Vector3(0, 0.48, 0);
    const cameras = {
      wide: { eye: [0, 1.85, 6.4], at: [0, 0.42, 0], fov: 30 },
      close: { eye: [flipX, 0.72, 2.15], at: [flipX, 0.58, 0], fov: 28 },
      side: { eye: [total * 0.55 + 1.2, 1.15, 3.4], at: [0, 0.45, 0], fov: 30 },
    };
    const preset = cameras[q.get('cam')] ?? cameras.wide;
    const camera = new THREE.PerspectiveCamera(preset.fov, innerWidth / innerHeight, 0.05, 80);
    camera.position.fromArray(preset.eye);
    look.fromArray(preset.at);
    camera.lookAt(look);
    spot.target.position.copy(look);

    let controls = null;
    if (q.get('free') === '1') {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(look);
      controls.update();
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const tOrigin = performance.now() - time * 1000;
    function frame() {
      if (!still) poseFlips((performance.now() - tOrigin) / 1000);
      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    if (still) {
      renderer.render(scene, camera);
    } else {
      renderer.setAnimationLoop(frame);
    }
    requestAnimationFrame(() => {
      renderer.render(scene, camera);
      requestAnimationFrame(() => {
        window.__ready = true;
      });
    });
    console.info(`[characters] ${chars.ids.length} drawings, ${flips.length} cycle${flips.length === 1 ? '' : 's'}, fallback ${standIn ? 'yes' : 'no'}`);
  </script>
</body>
</html>
