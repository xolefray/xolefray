<!doctype html>
<!--
  dev/camera.html — the film's scene through the camera rig, plus review aids.
  A magenta marker sits on the active cue (the latest cue whose spread is open).
  Dashed guides mark the page-title band (top 10 %) and the caption band (bottom 16 %).
  Params: t=<sec> (default 20) · marker=0 · guides=0 · titles=0 · captions=0 · photos=0.
  window.__cam.sample(t, aspect?) poses the rig and returns [px,py,pz, tx,ty,tz, fov].
  window.__ready is set once two frames have drawn.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera rig</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a09; }
    canvas { display: block; }
    #overlay { position: fixed; inset: 0; pointer-events: none; }
    .guide { position: fixed; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(255, 80, 170, .75); pointer-events: none; }
    .guide span { position: absolute; right: 8px; top: 2px; color: #ff8ac4; font: 11px/1.2 monospace; }
    #info { position: fixed; right: 8px; top: 6px; color: #ff8ac4; font: 12px/1.35 monospace; text-align: right; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
  <div id="overlay"></div>
  <div id="info"></div>
  <script type="module">
    import * as THREE from 'three';
    import * as timeline from '../src/timeline.js';
    import { SPREADS, leafAngles, spreadAlpha } from '../src/timeline.js';
    import { makeRng } from '../src/util/rng.js';
    import { resolveFigures } from '../src/util/figures-fallback.js';
    import { FONT, loadFonts } from '../src/fonts.js';
    import { loadPhotos } from '../src/photos.js';
    import * as characterArt from '../src/characters.js';
    import * as paper from '../src/paper.js';
    import * as popup from '../src/popup.js';
    import { BOOK, createBook } from '../src/book.js';
    import { createEnvironment } from '../src/environment.js';
    import { createTitles } from '../src/titles.js';
    import { createCameraRig } from '../src/camera.js';
    import { SPREAD_MODULES } from '../src/spreads/index.js';

    const params = new URLSearchParams(location.search);
    const t0 = Number.parseFloat(params.get('t') ?? '20');
    const t = Number.isFinite(t0) ? t0 : 20;
    const flag = (name) => params.get(name) !== '0';
    document.documentElement.dataset.captions = params.get('captions') === '0' ? '0' : '1';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);

    await loadFonts();
    const photos = await loadPhotos();
    let figuresMod = null;
    try { figuresMod = await import('../src/figures.js'); } catch (err) {
      console.warn('[camera harness] figures.js:', err);
    }
    const figures = resolveFigures(figuresMod, paper);
    let characters = null;
    try { characters = await characterArt.loadCharacters({ disabled: params.get('chars') === '0' }); }
    catch (err) { console.warn('[camera harness] characters:', err); }

    const env = createEnvironment({ scene, renderer });
    const book = createBook({ photos, fonts: FONT });
    scene.add(book.group);

    const spreads = [];
    for (let i = 0; i < SPREAD_MODULES.length; i++) {
      const info = SPREADS[i];
      const mod = SPREAD_MODULES[i];
      try {
        let art = null;
        try { art = await characterArt.loadCharacters({ disabled: false, base: `../art/${info.id}/` }); }
        catch { art = null; }
        const api = mod.build({
          THREE, paper, popup, rng: makeRng(1000 + info.k), BOOK,
          photos, figures, characters, characterArt, FONT, timeline, art,
        });
        book.getSpreadAnchor(info.k).add(api.group);
        book.setPageArt(info.k, { left: api.leftArt, right: api.rightArt });
        spreads.push({ ...info, api });
      } catch (err) {
        console.error(`[camera harness] spread ${info.id} failed:`, err);
      }
    }

    // World-space cues, the same way main.js collects them (anchor at the fully open pose).
    const worldCues = [];
    const phis = leafAngles(0);
    for (const s of spreads) {
      const list = Array.isArray(s.api.cues) ? s.api.cues : [];
      if (!list.length) continue;
      try {
        leafAngles(s.open ?? s.start + 3, phis);
        book.setLeafAngles(phis);
        book.group.updateMatrixWorld(true);
        const anchor = book.getSpreadAnchor(s.k);
        anchor.updateWorldMatrix(true, false);
        for (const c of list) {
          const at = c && c.at;
          if (!c || !Number.isFinite(c.t) || !at || !at.every?.(Number.isFinite)) continue;
          worldCues.push({
            t: c.t,
            hold: Number.isFinite(c.hold) ? c.hold : 0,
            at: new THREE.Vector3(at[0], at[1], at[2]).applyMatrix4(anchor.matrixWorld),
            size: Number.isFinite(c.size) && c.size > 0 ? c.size : 7.5,
            from: c.from || 'front',
            spread: s.k,
          });
        }
      } catch (err) {
        console.warn(`[camera harness] cues of ${s.id}:`, err);
      }
    }
    worldCues.sort((a, b) => a.t - b.t);

    function pose(time) {
      leafAngles(time, phis);
      book.setLeafAngles(phis);
      for (const s of spreads) {
        const alpha = spreadAlpha(s.k, phis);
        s.api.group.visible = alpha > 0.002;
        if (s.api.group.visible) {
          try { s.api.update(alpha, time, time - s.start); } catch (err) {
            console.error(`[camera harness] ${s.id} update:`, err);
            s.api.group.visible = false;
          }
        }
      }
      env.update(time);
      book.update?.(time);
    }

    const rig = createCameraRig(camera, { getCues: () => worldCues });

    function activeCue(time) {
      let best = null;
      for (let i = 0; i < worldCues.length; i++) {
        const c = worldCues[i];
        if (c.t <= time + 0.25) best = c;
      }
      if (!best) return null;
      const s = SPREADS[best.spread - 1];
      if (!s || time < s.start + 0.6) return null;
      if (s.end != null && time > s.end + 0.2) return null;
      return best;
    }

    pose(t);
    rig.update(t);

    const showMarker = flag('marker');
    const markerMat = new THREE.MeshBasicMaterial({ color: '#ff2fd0', depthTest: false, transparent: true, opacity: 0.9 });
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 10), markerMat);
    dot.renderOrder = 10;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 1, 6), markerMat);
    stem.renderOrder = 10;
    dot.visible = false;
    stem.visible = false;
    scene.add(dot, stem);

    function placeMarker(time) {
      const cue = showMarker ? activeCue(time) : null;
      dot.visible = stem.visible = !!cue;
      if (!cue) return;
      dot.position.copy(cue.at);
      const h = Math.max(0.05, cue.at.y);
      stem.scale.set(1, h, 1);
      stem.position.set(cue.at.x, h * 0.5, cue.at.z);
    }
    placeMarker(t);

    const titles = flag('titles') ? createTitles(document.getElementById('overlay')) : null;
    titles?.update(t);

    if (flag('guides')) {
      const title = document.createElement('div');
      title.className = 'guide';
      title.style.top = '10%';
      title.innerHTML = '<span>title band</span>';
      const cap = document.createElement('div');
      cap.className = 'guide';
      cap.style.top = '84%';
      cap.innerHTML = '<span>caption band</span>';
      document.body.append(title, cap);
    }

    const info = document.getElementById('info');
    function writeInfo(time) {
      if (!flag('guides')) { info.textContent = ''; return; }
      const cue = activeCue(time);
      const c = camera.position;
      let where = 'no cue';
      if (cue) {
        camera.updateMatrixWorld(true);
        const p = cue.at.clone().project(camera);
        where = `cue s${cue.spread} ${cue.from}  ${((p.x + 1) * 50).toFixed(0)}% , ${((1 - p.y) * 50).toFixed(0)}%`;
      }
      info.textContent =
        `t=${time}  fov ${camera.fov.toFixed(1)}  aspect ${camera.aspect.toFixed(2)}\n` +
        `cam ${c.x.toFixed(2)} ${c.y.toFixed(2)} ${c.z.toFixed(2)}\n` + where;
    }
    writeInfo(t);

    window.__cam = {
      cues: worldCues,
      sample(time, aspect) {
        const timeN = Number(time) || 0;
        if (Number.isFinite(aspect) && aspect > 0) camera.aspect = aspect;
        pose(timeN);
        rig.update(timeN);
        placeMarker(timeN);
        titles?.update(timeN);
        return [camera.position.x, camera.position.y, camera.position.z, rig.aim.x, rig.aim.y, rig.aim.z, camera.fov];
      },
    };

    let frames = 0;
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
      if (++frames >= 2) window.__ready = true;
    });
  </script>
</body>
</html>
