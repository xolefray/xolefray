<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Toolkit Bench</title>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1716; color: #eee; font: 13px/1.3 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #panel { position: fixed; left: 10px; top: 10px; padding: 8px 10px; background: rgba(0,0,0,.55); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: calc(100% - 40px); }
    #panel input[type=range] { width: 180px; }
    #panel button { background: #3a3230; color: #eee; border: 1px solid #665; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
    #panel.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="panel">
    <label>open <input id="open" type="range" min="0" max="1" step="0.005"> <span id="openv"></span></label>
    <label><input id="night" type="checkbox"> night</label>
    <label>glow <input id="glow" type="range" min="0" max="1" step="0.01" value="1"></label>
    <span>cam:</span>
    <button data-cam="front">front</button><button data-cam="low">low</button><button data-cam="side">side</button>
    <button data-cam="top">top</button><button data-cam="gallery">gallery</button><button data-cam="fox">fox</button>
    <span style="opacity:.7">drag to orbit</span>
  </div>
  <script type="module" src="./paper-demo.js"></script>
</body>
</html>
